
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'camara_senado_data_transformation'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'camara-senado-data-transformation'

# These configurations specify where dbt should look for different types of files.
# The `source-paths` and `target-path` are configs that partially define
# a dbt project's structure, in this case, a dbt project will place its files
# in this directory. You may customize these configs so that dbt will read
# non-standard directories.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# Models organized by subject (assunto) → then by layer (staging, intermediate, marts)
models:
  camara_senado_data_transformation:
    # Default: views
    materialized: view

    camara:
      # Votações models
      votacoes:
        staging:
          materialized: view
          +tags: ["staging", "votacoes"]
        intermediate:
          materialized: table
          +tags: ["intermediate", "votacoes"]
        marts:
          materialized: table
          +tags: ["marts", "votacoes"]

      # Frentes models
      frentes:
        staging:
          materialized: view
          +tags: ["staging", "frentes"]
        intermediate:
          materialized: table
          +tags: ["intermediate", "frentes"]
        marts:
          materialized: table
          +tags: ["marts", "frentes"]

      # Deputados models
      deputados:
        staging:
          materialized: view
          +tags: ["staging", "deputados"]
        intermediate:
          materialized: table
          +tags: ["intermediate", "deputados"]
        marts:
          materialized: table
          +tags: ["marts", "deputados"]

      # Despesas models
      despesas:
        staging:
          materialized: view
          +tags: ["staging", "despesas"]
        intermediate:
          materialized: table
          +tags: ["intermediate", "despesas"]
        marts:
          materialized: table
          +tags: ["marts", "despesas"]
